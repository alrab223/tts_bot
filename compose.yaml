name: gekiatsu-tts
services:
  tts-bot:
    image: gekiatsu-tts:1.0.0
    build:
      context: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - tts-data:/app/data
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  tts-data:
