[project]
name = "gekiatsu-tts-bot"
version = "1.0.0"
description = "Discord voice reading bot extracted from develop_gekiatsu"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "discord.py[voice]==2.7.1",
    "davey==0.1.6",
    "gtts==2.5.4",
    "pynacl==1.5.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "gspread==6.1.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79
indent-width = 3

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "pycodestyle>=2.15.0",
    "ruff>=0.17.1",
]
